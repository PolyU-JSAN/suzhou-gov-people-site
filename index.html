<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="bingbot" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="苏州人员检索">
<title>苏州市政府人员检索</title>
<style>
  :root{
    --primary:#1f4e79; --primary-dark:#15324f; --accent:#c0392b; --accent2:#2563eb;
    --bg:#eef2f6; --card:#ffffff; --line:#e2e8f0; --text:#1f2933; --muted:#64748b;
    --soft:#f1f5f9; --shadow:0 1px 3px rgba(15,23,42,.08),0 6px 20px rgba(15,23,42,.06);
    --chip:#eaf1fb;
  }
  [data-theme="dark"]{
    --primary:#4f8fd6; --primary-dark:#1e3a5f; --accent:#ff6b5b; --accent2:#60a5fa;
    --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
    --soft:#273549; --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    --chip:#24344c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
  header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:24px 24px 70px;position:relative}
  .head-inner{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  header h1{font-size:23px;font-weight:700;letter-spacing:.5px}
  header p{opacity:.85;font-size:13px;margin-top:6px}
  .theme-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;
    padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}
  .theme-btn:hover{background:rgba(255,255,255,.28)}
  .theme-btn.has-update{background:var(--accent);border-color:var(--accent)}

  .stats{max-width:1120px;margin:-48px auto 0;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;position:relative;z-index:2}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;color:var(--primary)}
  .stat .l{font-size:13px;color:var(--muted);margin-top:2px}
  .stat .s{font-size:12px;color:var(--accent);margin-top:4px}

  .controls{max-width:1120px;margin:18px auto 0;padding:0 24px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
  .search-row{display:flex;gap:10px;flex-wrap:wrap}
  .search-input{flex:1;min-width:240px;position:relative;display:flex;align-items:center}
  .search-input svg{position:absolute;left:13px;width:18px;height:18px;fill:var(--muted)}
  .search-input input{width:100%;padding:12px 12px 12px 40px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;outline:none;background:var(--soft);color:var(--text);transition:.15s}
  .search-input input:focus{border-color:var(--primary);background:var(--card)}
  select{padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:var(--soft);color:var(--text);outline:none;cursor:pointer}
  select:focus{border-color:var(--primary)}
  .btn{border:1.5px solid var(--line);background:var(--soft);color:var(--text);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .btn.primary:hover{filter:brightness(1.05);color:#fff}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{padding:7px 15px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:14px;cursor:pointer;color:var(--muted);transition:.15s;user-select:none}
  [data-theme="dark"] .tab{background:var(--card)}
  .tab:hover{border-color:var(--primary);color:var(--primary)}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}

  .meta{max-width:1120px;margin:18px auto 0;padding:0 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .meta .count{font-size:14px;color:var(--muted)}
  .meta .count b{color:var(--primary);font-size:17px}
  .reset-btn{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;text-decoration:underline}

  main{max-width:1120px;margin:12px auto 40px;padding:0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);position:relative;transition:.15s}
  .card:hover{transform:translateY(-2px);border-color:#c7d6ea}
  [data-theme="dark"] .card:hover{border-color:var(--primary)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card .name{font-size:18px;font-weight:700;color:var(--primary-dark);white-space:nowrap;word-break:keep-all;flex-shrink:0}
  [data-theme="dark"] .card .name{color:var(--primary)}
  .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
  .badge.cat{background:var(--chip);color:var(--primary)}
  .pos-line{margin-top:6px}
  .badge.pos{background:#fdecea;color:var(--accent);white-space:normal;max-width:100%;display:inline-block;line-height:1.45}
  [data-theme="dark"] .badge.pos{background:#3a2530}
  .info{margin-top:7px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 12px}
  .info b{color:var(--text);font-weight:600}
  .tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:12px;background:var(--soft);color:var(--muted);padding:3px 9px;border-radius:7px}
  .copy-btn{margin-left:auto;font-size:12px;color:var(--accent2);background:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px;cursor:pointer}
  .copy-btn:hover{border-color:var(--accent2)}
  .detail{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .card.open .detail{max-height:1400px;margin-top:11px}
  .detail .resume{font-size:13.5px;color:#374151;background:var(--soft);border-radius:10px;padding:11px 13px;border-left:3px solid var(--primary)}
  [data-theme="dark"] .detail .resume{color:#cbd5e1}
  .detail .remark{font-size:12.5px;color:var(--accent);margin-top:9px}
  .detail .remark::before{content:"备注：";font-weight:600}
  .hint{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:4px}

  .pager{max-width:1120px;margin:20px auto 0;padding:0 24px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
  .pager button{min-width:36px;height:36px;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;cursor:pointer;font-size:14px;padding:0 10px;transition:.15s}
  .pager button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
  .pager button.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .pager button:disabled{opacity:.4;cursor:not-allowed}

  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 20px}
  .empty svg{width:44px;height:44px;fill:#cbd5e1;margin-bottom:10px}
  mark{background:#fff3a3;color:inherit;padding:0 1px;border-radius:2px}
  [data-theme="dark"] mark{background:#a16207;color:#fff}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--primary-dark);color:#fff;
    padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{max-width:1120px;margin:0 auto 40px;padding:0 24px;font-size:12px;color:#94a3b8;text-align:center}

  /* access gate */
  #gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
  body.unlocked #gate{display:none}
  .gate-box{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);border-radius:18px;
    padding:34px 32px;width:min(360px,90vw);text-align:center;color:#fff;backdrop-filter:blur(8px);box-shadow:var(--shadow)}
  .gate-lock{font-size:40px;line-height:1}
  .gate-box h2{font-size:20px;margin:12px 0 4px;font-weight:700}
  .gate-sub{opacity:.82;font-size:13px;margin-bottom:18px}
  #gatePwd{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.30);
    background:rgba(255,255,255,.12);color:#fff;font-size:15px;outline:none;transition:.15s}
  #gatePwd:focus{border-color:#fff;background:rgba(255,255,255,.18)}
  #gatePwd::placeholder{color:rgba(255,255,255,.6)}
  .gate-btn{margin-top:14px;width:100%;padding:12px;border:none;border-radius:10px;background:#fff;color:var(--primary-dark);
    font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
  .gate-btn:hover{filter:brightness(.95)}
  .gate-btn:disabled{opacity:.6;cursor:default}
  .gate-err{margin-top:12px;font-size:13px;color:#ffd2cc;min-height:18px}

  @media(max-width:760px){
    header h1{font-size:20px}
  }
  @media print{
    header, .controls, .meta, .pager, .theme-btn, .copy-btn, footer, .hint{display:none !important}
    body{background:#fff}
    .card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
    .card .detail{max-height:none !important;margin-top:10px}
    main,.stats{max-width:100%}
  }
</style>
</head>
<body class="locked">
<div id="gate">
  <div class="gate-box">
    <div class="gate-lock">🔒</div>
    <h2>苏州市政府人员检索</h2>
    <p class="gate-sub">本页面已加密，请输入访问密码</p>
    <input id="gatePwd" type="password" placeholder="访问密码" autocomplete="off">
    <button id="gateBtn" class="gate-btn">解 锁</button>
    <div id="gateErr" class="gate-err"></div>
  </div>
</div>
<header>
  <div class="head-inner">
    <div>
      <h1>苏州市政府人员检索</h1>
      <p>更新日期：2026年8月23日</p>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-start">
      <button class="theme-btn" id="refreshBtn" onclick="refreshData()">🔄 刷新</button>
      <button class="theme-btn" id="themeBtn">🌙 暗色</button>
    </div>
  </div>
</header>

<section class="stats" id="stats"></section>

<div class="controls">
  <div class="panel">
    <div class="search-row">
      <div class="search-input">

        <input id="q" type="text" placeholder="搜索姓名 / 职务 / 单位 / 区县 / 关键词（空格分词，可多词）" autocomplete="off">

    <div class="tabs" id="tabs">

      <span class="tab" data-cat="市政府领导">市政府领导</span>
      <span class="tab" data-cat="市委领导">市委领导</span>
      <span class="tab" data-cat="区县党政">区县党政</span>
      <span class="tab" data-cat="市级委办局">市级委办局</span>
      <span class="tab" data-cat="区县委办局">区县委办局</span>
      <span class="tab" data-cat="国企人员">国企人员</span>
    </div>
    <div class="search-row">
      <button class="btn" id="printBtn">🖨 打印</button>
      <span style="flex:1"></span>
      <button class="reset-btn" id="reset">重置筛选</button>
    </div>
  </div>
</div>

<div class="meta">
  <div class="count">共 <b id="cnt">0</b> 位 · 当前页 <span id="range"></span></div>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="pager" id="pager"></div>

<footer>本页面为内部检索工具，数据以原表为准。点击卡片展开简历。</footer>

<div class="toast" id="toast"></div>

let PEOPLE = null;
let SITE_PWD = null;         // 解锁密码（保留在内存，供「刷新」时重新解密新密文）
let CURRENT_ENC = ENCRYPTED; // 当前生效的密文，用于判断线上是否有更新
const PAGE_SIZE = 12;
const CAT_ORDER = {"市政府领导":0,"市委领导":1,"区县党政":2,"市级委办局":3,"区县委办局":4,"国企人员":5};
const grid=document.getElementById('grid'), qEl=document.getElementById('q'),
      unitSel=document.getElementById('unitSel'), sortSel=document.getElementById('sortSel'),
      cntEl=document.getElementById('cnt'), rangeEl=document.getElementById('range'),
      pager=document.getElementById('pager'), tabs=document.getElementById('tabs'),
      statsEl=document.getElementById('stats'), toastEl=document.getElementById('toast');

let state={q:"",cat:"全部",unit:"",sort:"default",page:1};

// ---- stats (fixed, from all data) ----
function renderStats(){
  const c=k=>PEOPLE.filter(p=>p.category===k).length;
  const tiles=[
    {n:c("市委领导"),l:"市委领导",s:"市委常委"},
    {n:c("市政府领导"),l:"市政府领导",s:"市长 / 副市长"},
    {n:c("区县党政"),l:"区县党政",s:"党委 + 政府主官"},
    {n:c("市级委办局"),l:"市级委办局",s:"各部门负责人"},
    {n:c("区县委办局"),l:"区县委办局",s:"各区县部门负责人"},
    {n:c("国企人员"),l:"国企人员",s:"市属国企负责人"}
  ];
  statsEl.innerHTML=tiles.map(t=>`<div class="stat"><div class="n">${t.n}</div><div class="l">${t.l}</div><div class="s">${t.s}</div></div>`).join('');
}

// ---- unit dropdown ----
function fillUnits(){
  const units=[...new Set(PEOPLE.map(p=>p.unit).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));
  const cur=unitSel.value;
  unitSel.innerHTML='<option value="">全部单位 / 区县</option>';
  units.forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;unitSel.appendChild(o);});
  if([...units].includes(cur)) unitSel.value=cur;
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(text,terms){
  if(!terms.length) return esc(text);
  let t=esc(text);
  terms.forEach(term=>{if(!term)return;const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');t=t.replace(re,m=>'<mark>'+m+'</mark>');});
  return t;
}
function haystack(p){return [p.name,p.position,p.unit,p.region,p.genderEthnicity,p.birth,p.education,p.appointment,p.resume,p.remark,p.category].join(' ');}
// 模糊搜索：子串匹配 或 子序列匹配（如“工信局”可命中“工业和信息化局”，“发改委”可命中“发展和改革委员会”）
function isSubseq(term,text){let i=0;for(const ch of term){const idx=text.indexOf(ch,i);if(idx<0)return false;i=idx+1;}return true;}
function fuzzy(text,term){return text.includes(term)||isSubseq(term,text);}

function filter(){
  const terms=state.q.trim().split(/\s+/).filter(Boolean);
  let list=PEOPLE.filter(p=>{
    if(state.cat!=='全部'&&p.category!==state.cat)return false;
    if(state.unit&&p.unit!==state.unit)return false;
    if(terms.length){const h=haystack(p).toLowerCase();if(!terms.every(t=>fuzzy(h,t.toLowerCase())))return false;}
    return true;
  });
  if(state.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  else if(state.sort==='cat') list.sort((a,b)=>CAT_ORDER[a.category]-CAT_ORDER[b.category]||a.name.localeCompare(b.name,'zh'));
  else if(state.sort==='unit') list.sort((a,b)=>(a.unit||'').localeCompare(b.unit||'','zh')||a.name.localeCompare(b.name,'zh'));
  return list;
}

function render(){
  const list=filter();
  const total=list.length;
  const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(state.page>pages)state.page=pages;
  const start=(state.page-1)*PAGE_SIZE;
  const slice=list.slice(start,start+PAGE_SIZE);
  cntEl.textContent=total;
  rangeEl.textContent= total? (start+1)+'–'+Math.min(start+PAGE_SIZE,total)+' / '+total : '0';
  grid.innerHTML='';
  if(!slice.length){
    grid.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg><div>未找到匹配人员，试试其他关键词。</div></div>';
    pager.innerHTML='';
    return;
  }
  const terms=state.q.trim().split(/\s+/).filter(Boolean);
  slice.forEach(p=>{
    const card=document.createElement('div');card.className='card';
    const info=[];
    if(p.region)info.push('<span><b>区县</b> '+esc(p.region)+'</span>');
    if(p.genderEthnicity)info.push('<span>'+esc(p.genderEthnicity)+'</span>');
    if(p.birth)info.push('<span><b>出生</b> '+esc(p.birth)+'</span>');
    if(p.education)info.push('<span><b>学历</b> '+esc(p.education)+'</span>');
    if(p.appointment)info.push('<span><b>任命</b> '+esc(p.appointment)+'</span>');
    const remark=p.remark?'<div class="remark">'+hl(p.remark,terms)+'</div>':'';
    card.innerHTML=
      '<div class="top"><div class="name">'+hl(p.name,terms)+'</div>'+
      '<div class="badges"><span class="badge cat">'+esc(p.category)+'</span></div></div>'+
      '<div class="pos-line"><span class="badge pos">'+hl(p.position,terms)+'</span></div>'+
      '<div class="info">'+info.join('')+'</div>'+
      '<div class="tags"><span class="tag">'+hl(p.unit,terms)+'</span>'+
      '<button class="copy-btn" data-name="'+esc(p.name)+'">复制</button></div>'+
      '<div class="detail"><div class="resume">'+hl(p.resume,terms)+'</div>'+remark+'</div>'+
      '<div class="hint">▾ 点击查看简历</div>';
    card.addEventListener('click',e=>{if(e.target.closest('.copy-btn'))return;card.classList.toggle('open');});
    card.querySelector('.copy-btn').addEventListener('click',e=>{e.stopPropagation();copyPerson(p);});
    grid.appendChild(card);
  });
  renderPager(pages);
}

function renderPager(pages){
  let html='';
  html+='<button '+(state.page===1?'disabled':'')+' data-p="prev">‹ 上一页</button>';
  const win=[];
  for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-state.page)<=2)win.push(i);}
  let last=0;
  win.forEach(i=>{if(i-last>1)html+='<button disabled>…</button>';html+='<button class="'+(i===state.page?'active':'')+'" data-p="'+i+'">'+i+'</button>';last=i;});
  html+='<button '+(state.page===pages?'disabled':'')+' data-p="next">下一页 ›</button>';
  pager.innerHTML=html;
  pager.querySelectorAll('button[data-p]').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.p;
    if(v==='prev')state.page=Math.max(1,state.page-1);
    else if(v==='next')state.page=Math.min(pages,state.page+1);
    else state.page=+v;
    render();window.scrollTo({top:document.querySelector('.meta').offsetTop-10,behavior:'smooth'});
  }));
}

function copyPerson(p){
  const lines=[p.name+'（'+p.category+' · '+p.position+'）','单位/区县：'+(p.unit||''),
    p.region?'所属区县：'+p.region:'', p.birth?'出生：'+p.birth:'', p.education?'学历：'+p.education:'',
    p.appointment?'任命：'+p.appointment:'', p.resume?'简历：'+p.resume:'', p.remark?'备注：'+p.remark:''].filter(Boolean);
  const txt=lines.join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('已复制：'+p.name)).catch(()=>toast('复制失败，请手动选择'));
}

// ---- access gate (client-side AES-GCM decryption) ----
const gate=document.getElementById('gate'), gatePwd=document.getElementById('gatePwd'),
      gateBtn=document.getElementById('gateBtn'), gateErr=document.getElementById('gateErr');
const _enc=new TextEncoder(), _dec=new TextDecoder();
async function _deriveKey(pwd,salt){
  const base=await crypto.subtle.importKey('raw',_enc.encode(pwd),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlockData(){
  const pwd=gatePwd.value;
  if(!pwd){gateErr.textContent='请输入访问密码';return;}
  gateBtn.disabled=true;gateErr.textContent='校验中…';
  try{
    const buf=Uint8Array.from(atob(ENCRYPTED),c=>c.charCodeAt(0));
    const salt=buf.slice(0,16), nonce=buf.slice(16,28), data=buf.slice(28);
    const key=await _deriveKey(pwd,salt);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},key,data);
    PEOPLE=JSON.parse(_dec.decode(plain));
    SITE_PWD = pwd;
    document.body.classList.remove('locked');document.body.classList.add('unlocked');
    fillUnits();renderStats();render();
    checkUpdate();
    setInterval(checkUpdate, 180000);
  }catch(e){gateErr.textContent='密码错误，请重试';}
  finally{gateBtn.disabled=false;}
}
gateBtn.addEventListener('click',unlockData);
gatePwd.addEventListener('keydown',e=>{if(e.key==='Enter')unlockData();});
gatePwd.focus();

// ---- 刷新（解决 iPhone「添加到主屏幕」后内容无法更新）----
// 用 no-store + 缓存破坏参数强制向 GitHub Pages 重新拉取最新 index.html，
// 提取新密文后以内存中的解锁密码本地解密重渲染，无需重新输入密码。
async function _fetchLatestHtml(){
  const base = location.href.split('?')[0];
  const res = await fetch(base + '?_=' + Date.now(), {cache:'no-store', headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
  if(!res.ok) throw new Error('网络错误 '+res.status);
  return await res.text();
}
async function refreshData(){
  if(!PEOPLE) return;
  try{
    const txt = await _fetchLatestHtml();
    const m = txt.match(/const ENCRYPTED = "([^"]+)";/);
    if(!m) throw new Error('页面格式异常');
    if(m[1] === CURRENT_ENC){ toast('已经是最新内容'); return; }
    if(!SITE_PWD){ toast('请刷新页面后重新解锁再点刷新'); return; }
    const buf = Uint8Array.from(atob(m[1]), c=>c.charCodeAt(0));
    const salt = buf.slice(0,16), nonce = buf.slice(16,28), data = buf.slice(28);
    const key = await _deriveKey(SITE_PWD, salt);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce}, key, data);
    PEOPLE = JSON.parse(_dec.decode(plain));
    CURRENT_ENC = m[1];
    document.getElementById('refreshBtn').classList.remove('has-update');
    fillUnits(); renderStats(); render();
    toast('已更新到最新内容');
  }catch(e){ toast('刷新失败：'+e.message); }
}
async function checkUpdate(){
  if(!PEOPLE) return;
  try{
    const txt = await _fetchLatestHtml();
    const m = txt.match(/const ENCRYPTED = "([^"]+)";/);
    if(m && m[1] !== CURRENT_ENC){
      document.getElementById('refreshBtn').classList.add('has-update');
      toast('🔄 发现新内容，点击右上角「刷新」');
    }
  }catch(e){ /* 静默：后台探测，失败不影响使用 */ }
}
